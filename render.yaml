# Render Blueprint: kostenloser Web-Service (Free-Plan) mit Docker.
# Daten werden über Supabase Storage gesichert (Free-Plan hat keinen festen Speicher).
services:
  - type: web
    name: vio
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: VIO_INITIAL_PASSWORD
        sync: false
      - key: VIO_USER_NAME
        value: David
      # Ab Version 0.3 (optional – in Render unter "Environment" eintragen):
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
